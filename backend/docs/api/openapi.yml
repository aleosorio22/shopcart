        - name: texto
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: idCategoria
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
        - name: activo
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/productos/{referencia}:
    get:
      tags:
        - Catalogo
      summary: Detalle por id o slug
      security: *a1
      parameters:
        - name: referencia
          in: path
          required: true
          schema:
            type: string
            maxLength: 220
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/catalogo/productos/{id}:
    put:
      tags:
        - Catalogo
      summary: Editar producto (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idCategoria:
