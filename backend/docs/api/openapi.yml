openapi: 3.0.3
info:
  title: ShopCart API
  version: 1.0.0
  description: "Respuesta correcta: { success, data, meta? }. Error: { success:
    false, error: { codigo, mensaje, detalles?, requestId } }."
servers:
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /api/v1/auth/registro:
    post:
      tags:
        - Autenticacion
      summary: Registrar cliente
      security: &a1 []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  maxLength: 254
                contrasena:
                  type: string
                  minLength: 10
                nombres:
                  type: string
                  minLength: 1
                  maxLength: 100
                apellidos:
                  type: string
                  minLength: 1
                  maxLength: 100
                telefono:
                  type: string
                  pattern: ^\+?\d{8,15}$
              required:
                - correo
                - contrasena
                - nombres
                - apellidos
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/auth/login:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesion
      security: *a1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  maxLength: 254
                contrasena:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - correo
                - contrasena
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/auth/refresh:
    post:
      tags:
        - Autenticacion
      summary: Renovar el access token y rotar el refresh token
      security: *a1
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticacion
      summary: Cerrar sesion
      security: *a1
      parameters: []
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/auth/me:
    get:
      tags:
        - Autenticacion
      summary: Perfil y permisos del usuario
      security: &a2
        - bearer: []
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    patch:
      tags:
        - Autenticacion
      summary: Actualizar perfil
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombres:
                  type: string
                  minLength: 1
                  maxLength: 100
                apellidos:
                  type: string
                  minLength: 1
                  maxLength: 100
                telefono:
                  type: string
                  pattern: ^\+?\d{8,15}$
              required:
                - nombres
                - apellidos
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/auth/cambiar-contrasena:
    post:
      tags:
        - Autenticacion
      summary: Cambiar contrasena y cerrar las demas sesiones
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actual:
                  type: string
                  minLength: 1
                  maxLength: 200
                nueva:
                  type: string
                  minLength: 10
              required:
                - actual
                - nueva
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios (USUARIOS_GESTIONAR)
      security: *a2
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
        - name: tamanoPagina
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: texto
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: rol
          in: query
          required: false
          schema:
            type: string
            enum:
              - CLIENTE
              - OPERADOR
              - ADMINISTRADOR
        - name: activo
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    post:
      tags:
        - Usuarios
      summary: Crear usuario interno (USUARIOS_GESTIONAR)
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  maxLength: 254
                contrasena:
                  type: string
                  minLength: 10
                  maxLength: 72
                nombres:
                  type: string
                  minLength: 1
                  maxLength: 100
                apellidos:
                  type: string
                  minLength: 1
                  maxLength: 100
                rol:
                  type: string
                  enum:
                    - CLIENTE
                    - OPERADOR
                    - ADMINISTRADOR
              required:
                - correo
                - contrasena
                - nombres
                - apellidos
                - rol
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/usuarios/{id}/estado:
    patch:
      tags:
        - Usuarios
      summary: Activar o desactivar usuario (USUARIOS_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activo:
                  type: boolean
              required:
                - activo
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/clientes/direcciones:
    get:
      tags:
        - Clientes
      summary: Mis direcciones
      security: *a2
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    post:
      tags:
        - Clientes
      summary: Agregar direccion
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idMunicipio:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                alias:
                  type: string
                  minLength: 1
                  maxLength: 40
                destinatario:
                  type: string
                  minLength: 1
                  maxLength: 150
                telefono:
                  type: string
                  pattern: ^\+?\d{8,15}$
                linea1:
                  type: string
                  minLength: 1
                  maxLength: 200
                linea2:
                  type: string
                  maxLength: 200
                referencia:
                  type: string
                  maxLength: 300
                esPredeterminada:
                  default: false
                  type: boolean
              required:
                - idMunicipio
                - alias
                - destinatario
                - telefono
                - linea1
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/clientes/direcciones/{id}:
    put:
      tags:
        - Clientes
      summary: Editar direccion propia
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idMunicipio:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                alias:
                  type: string
                  minLength: 1
                  maxLength: 40
                destinatario:
                  type: string
                  minLength: 1
                  maxLength: 150
                telefono:
                  type: string
                  pattern: ^\+?\d{8,15}$
                linea1:
                  type: string
                  minLength: 1
                  maxLength: 200
                linea2:
                  type: string
                  maxLength: 200
                referencia:
                  type: string
                  maxLength: 300
                esPredeterminada:
                  default: false
                  type: boolean
              required:
                - idMunicipio
                - alias
                - destinatario
                - telefono
                - linea1
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    delete:
      tags:
        - Clientes
      summary: Desactivar direccion propia
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/clientes/municipios:
    get:
      tags:
        - Clientes
      summary: Departamentos y municipios
      security: *a1
      parameters:
        - name: idDepartamento
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/clientes/datos-fiscales:
    get:
      tags:
        - Clientes
      summary: Mis datos de facturacion
      security: *a2
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    post:
      tags:
        - Clientes
      summary: Guardar datos de facturacion
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nit:
                  type: string
                  pattern: ^(CF|\d{1,14}[0-9Kk]?)$
                nombreFiscal:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - nit
                - nombreFiscal
      responses:
        "204":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/categorias:
    get:
      tags:
        - Catalogo
      summary: Listar categorias
      security: *a1
      parameters:
        - name: incluirInactivas
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
    post:
      tags:
        - Catalogo
      summary: Crear categoria (CATALOGO_GESTIONAR)
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idCategoriaPadre:
                  nullable: true
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                descripcion:
                  nullable: true
                  type: string
                  maxLength: 500
                orden:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 32767
                activo:
                  default: true
                  type: boolean
              required:
                - nombre
                - slug
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/categorias/{id}:
    put:
      tags:
        - Catalogo
      summary: Editar categoria (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idCategoriaPadre:
                  nullable: true
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                descripcion:
                  nullable: true
                  type: string
                  maxLength: 500
                orden:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 32767
                activo:
                  default: true
                  type: boolean
              required:
                - nombre
                - slug
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
    delete:
      tags:
        - Catalogo
      summary: Eliminar o desactivar categoria (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/marcas:
    get:
      tags:
        - Catalogo
      summary: Listar marcas
      security: *a1
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
    post:
      tags:
        - Catalogo
      summary: Crear marca (CATALOGO_GESTIONAR)
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                logoUrl:
                  nullable: true
                  type: string
                  maxLength: 500
                  format: uri
                activo:
                  default: true
                  type: boolean
              required:
                - nombre
                - slug
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/marcas/{id}:
    put:
      tags:
        - Catalogo
      summary: Editar marca (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                logoUrl:
                  nullable: true
                  type: string
                  maxLength: 500
                  format: uri
                activo:
                  default: true
                  type: boolean
              required:
                - nombre
                - slug
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/atributos:
    get:
      tags:
        - Catalogo
      summary: Listar atributos y valores
      security: *a1
      parameters: []
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
  /api/v1/catalogo/atributos/{id}/valores:
    post:
      tags:
        - Catalogo
      summary: Agregar un valor a un atributo (un color o talla nueva)
        (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valor:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
                - valor
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/productos:
    get:
      tags:
        - Catalogo
      summary: Buscar productos con filtros
      security: *a1
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
        - name: tamanoPagina
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: texto
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: idCategoria
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
        - name: idMarca
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
        - name: precioMinimo
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: precioMaximo
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: soloDisponibles
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: soloEnOferta
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: orden
          in: query
          required: false
          schema:
            default: RECIENTES
            type: string
            enum:
              - RECIENTES
              - PRECIO_ASC
              - PRECIO_DESC
              - NOMBRE
      responses:
        "200":
          description: Correcto
        "400":
          description: Datos invalidos
    post:
      tags:
        - Catalogo
      summary: Crear producto (CATALOGO_GESTIONAR)
      security: *a2
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idCategoria:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                idMarca:
                  nullable: true
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                descripcion:
                  nullable: true
                  type: string
                  maxLength: 10000
                mesesGarantia:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 120
                codigoImpuesto:
                  default: IVA
                  type: string
                  enum:
                    - IVA
                    - EXENTO
                activo:
                  default: true
                  type: boolean
              required:
                - idCategoria
                - nombre
                - slug
      responses:
        "201":
          description: Correcto
        "400":
          description: Datos invalidos
        "401":
          description: Token ausente, invalido o expirado
        "403":
          description: Sin permiso
  /api/v1/catalogo/admin/productos:
    get:
      tags:
        - Catalogo
      summary: Listar productos, incluidos inactivos (CATALOGO_GESTIONAR)
      security: *a2
      parameters:
        - name: pagina
          in: query
